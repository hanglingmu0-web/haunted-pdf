name: Verify PDF demonstrations
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python src/verify_hashes.py
      - run: python src/pdf_tools.py inspect
      - run: python src/pdf_tools.py extract
      - run: python src/pdf_tools.py build
      - run: python src/pdf_tools.py validate
      - run: node tests/timer.test.cjs
